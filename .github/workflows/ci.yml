name: CI

# This repository stands on its own. Nothing here checks out, fetches, or
# authenticates against another repository — that independence is the point of
# the extraction, and it is cheap to lose by accident. Deliberately no reference
# to the repository this package came from appears in this file at all, not even
# in a comment, so that "does CI reach outward?" stays a one-line grep.
# The extraction itself is recorded in docs/provenance.md.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Everything that needs no built artifact. Fast, and the job that fails first
  # when something ordinary is wrong.
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Note the gap with `engines.node` in package.json, which says `>=22`:
      # every job here runs 24 only. 22 is claimed because it is Active LTS and
      # nothing in the dependency graph needs more, but it is supported by
      # intent rather than by test. Closing that gap means matrixing this job
      # over [22, 24] — worth doing if a consumer reports actually running 22,
      # and not worth the CI minutes before then.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The build runs here as well as in `package-build` below. It is a few
      # seconds, and having it in the fast job means a broken emit is reported
      # alongside the type error that usually caused it rather than only after
      # the slower pack-and-install cycle.
      - name: Build
        run: pnpm build

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # Proves the package is still publishable, without publishing it.
  #
  # Its own job rather than a step above for two reasons: it is the only thing in
  # CI that packs the package and installs the tarball into a real external
  # consumer, and it runs `pnpm install` over a fixture whose peers are resolved
  # by auto-install — so it executes noticeably more third-party code than the
  # checks job does.
  package-build:
    runs-on: ubuntu-latest

    steps:
      # This job packs a tarball and installs an external fixture, so it runs
      # more third-party code than the other job. It needs no git auth after
      # checkout, so do not leave the token in .git/config for that code to read.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build → pack → install the tarball into examples/external-consumer with
      # --ignore-workspace → type-check under "bundler" and "nodenext" → build the
      # three measurement arms → assert the entry-graph boundaries.
      # `verify:package` builds the package itself as its first step, so there is
      # no separate build step here — adding one would just pay for a second
      # `tsc` + `tsc-alias` pass on every run.
      - name: Verify publishability
        run: pnpm verify:package

  # Builds both example shells — the web demo (examples/demo) and the
  # Electron e2e host (examples/electron) — against the packed tarball, the
  # same way a real external adopter installs the package (FR-009).
  examples-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds and packs @liminis/editor once, generates the demo's fixture
      # data from the round-trip corpus (docs/decisions/adr-081.md), then
      # installs the tarball into examples/demo and examples/electron and
      # builds each — see scripts/build-examples.mjs.
      - name: Build example shells
        run: pnpm build:examples

      # Exercises the exact build .github/workflows/pages.yml runs on every
      # release (verveguy/liminis-editor#3), even though no release has been
      # published yet to trigger that workflow for real. Duplicates the pack
      # step build:examples just did — accepted, since the alternative is a
      # source of a broken Pages deploy invisible to CI until an actual
      # release ships.
      - name: Build the Pages site (smoke test)
        run: pnpm build:site

  # Runs the Electron e2e suite (FR-010): the tests that reproduce the
  # read-only create-affordance defect and the toolbar-surfaced-kind defect
  # named in this package's own issue tracker, against real Electron/Chromium.
  #
  # Its own job rather than a step in examples-build: a real Electron launch
  # is slower and less deterministic than a plain `vite build`, and it needs
  # its own retry budget (below) without slowing the fast build job down.
  electron-shell-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build example shells
        run: pnpm build:examples

      # A real BrowserWindow needs a display even on a "headless" Linux
      # runner. Electron ships its own Chromium, so there is no
      # `playwright install` browser-download step to run here.
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run the Electron e2e suite
        run: xvfb-run -a pnpm --dir examples/electron run test:e2e
