name: Deploy Pages

# Release-triggered, not push-triggered (FR-010): the public demo pins to the
# latest published version, not the default branch, so a broken merge to
# main cannot break the live site and an evaluator never sees behaviour
# `npm install` wouldn't give them. See docs/decisions/adr-082.md.
#
# The site is now the documentation, with the demo one level down at /demo/.
# That keeps FR-010's property — the demo is still built from the release —
# while giving the root URL to the docs, which are what a reader arriving at
# the project needs first. Anything still linking to the old root lands on the
# documentation rather than a 404.
#
# Documentation moving on a release cadence is a deliberate consequence: a
# published page always describes a version somebody can install. Use
# `workflow_dispatch` to publish a documentation fix between releases.
#
# `workflow_dispatch` is kept for rebuilding the site without cutting a
# release — recovering from an infrastructure failure, say. Prefer re-running
# the release-triggered run when there is one: a dispatched run has no
# `github.event.release`, so the version badge below comes out empty.
#
# Deploying from a release means the deploying ref is a tag, so the
# `github-pages` environment must permit `v*` tags and not just `main`. A
# branch-only policy rejects the deploy job before it runs a single step,
# which surfaces as a failed job with an empty step list and no log at all.
on:
  release:
    types: [published]
  workflow_dispatch:

# Only one Pages deploy should ever be in flight; a second release published
# mid-deploy should wait for the first to finish rather than race it.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v4

      # site/ is its own package, deliberately not a workspace member: the
      # published package's dev install is what CI runs for lint, typecheck and
      # test on every pull request, and an Astro toolchain has no business in
      # it. It also keeps @liminis/diagrams resolving from the registry rather
      # than from this repo.
      - name: Install documentation site dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      # Builds @liminis/editor, packs it, regenerates the demo's fixture and
      # documentation data, builds examples/demo against the tarball, and
      # stages the result at site/public/demo — see site/scripts/stage-demo.mjs,
      # which wraps scripts/build-site.mjs. The same command a developer runs.
      #
      # The version badge (FR-011) is sourced from the triggering release's tag
      # rather than package.json, so the badge states the version this site was
      # actually built and deployed from. package.json on main can already carry
      # the *next* version after a release, and reading it here would label the
      # live site with a version nobody can install.
      - name: Build and stage the demo
        working-directory: site
        run: pnpm demo
        env:
          VITE_LIMINIS_EDITOR_VERSION: ${{ github.event.release.tag_name }}
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Astro copies public/ — the staged demo included — into its own output,
      # so the demo ships as part of the site rather than being assembled
      # afterwards. One artifact, one deploy.
      - name: Build the documentation site
        working-directory: site
        run: pnpm build

      - name: Check the rendered diagrams are current
        working-directory: site
        run: pnpm diagrams:check

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
