name: Deploy Pages

# Release-triggered, not push-triggered (FR-010): the public demo pins to the
# latest published version, not the default branch, so a broken merge to
# main cannot break the live site and an evaluator never sees behaviour
# `npm install` wouldn't give them. See docs/decisions/adr-082.md.
#
# `workflow_dispatch` is kept for rebuilding the site without cutting a
# release — recovering from an infrastructure failure, say. Prefer re-running
# the release-triggered run when there is one: a dispatched run has no
# `github.event.release`, so the version badge below comes out empty.
#
# Deploying from a release means the deploying ref is a tag, so the
# `github-pages` environment must permit `v*` tags and not just `main`. A
# branch-only policy rejects the deploy job before it runs a single step,
# which surfaces as a failed job with an empty step list and no log at all.
on:
  release:
    types: [published]
  workflow_dispatch:

# Only one Pages deploy should ever be in flight; a second release published
# mid-deploy should wait for the first to finish rather than race it.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v4

      # Builds @liminis/editor, packs it, regenerates the demo's fixture and
      # documentation data, and builds examples/demo against the tarball —
      # see scripts/build-site.mjs. The version badge (FR-011) is sourced
      # from the triggering release's tag rather than package.json, so the
      # badge states the version this site was actually built and deployed
      # from. package.json on main can already carry the *next* version after
      # a release, and reading it here would label the live site with a
      # version nobody can install.
      - name: Build the site
        run: pnpm build:site
        env:
          VITE_LIMINIS_EDITOR_VERSION: ${{ github.event.release.tag_name }}
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
